global_costmap:
  ros__parameters:
    global_frame: "map"
    robot_base_frame: "base_link"
    use_sim_time: false
    plugin_names: ["static_layer", "obstacle_layer", "inflation_layer"]
    plugin_types: 
      ["nav2_costmap_2d::StaticLayer", 
       "nav2_costmap_2d::ObstacleLayer", 
       "nav2_costmap_2d::InflationLayer"]
    static_layer:
      map_topic: "map"
      subscribe_to_updates: true
    obstacle_layer:
      observation_sources: "scan"
      scan:
        topic: "scan"
        sensor_frame: "laser"
        observation_persistence: 0.0
        expected_update_rate: 0.0
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        obstacle_range: 2.5
        raytrace_range: 3.0
    inflation_layer:
      inflation_radius: 0.55
      cost_scaling_factor: 10.0

local_costmap:
  ros__parameters:
    global_frame: "odom"
    robot_base_frame: "base_link"
    use_sim_time: false
    rolling_window: true
    width: 3.0
    height: 3.0
    resolution: 0.05
    plugin_names: ["obstacle_layer", "inflation_layer"]
    plugin_types: 
      ["nav2_costmap_2d::ObstacleLayer", 
       "nav2_costmap_2d::InflationLayer"]
    obstacle_layer:
      observation_sources: "scan"
      scan:
        topic: "scan"
        sensor_frame: "laser"
        observation_persistence: 0.0
        expected_update_rate: 0.0
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        obstacle_range: 2.5
        raytrace_range: 3.0
    inflation_layer:
      inflation_radius: 0.55
      cost_scaling_factor: 10.0
